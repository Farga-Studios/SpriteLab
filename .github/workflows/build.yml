name: Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: SDK
        run: dotnet --info
      - name: Restore and audit direct and transitive packages
        run: dotnet restore SpriteLab.slnx -p:NuGetAudit=true -p:NuGetAuditMode=all -p:WarningsAsErrors=NU1903%3BNU1904
      - name: List vulnerable dependencies
        run: dotnet list SpriteLab.slnx package --vulnerable --include-transitive --no-restore
      - name: Build
        run: dotnet build SpriteLab.slnx -c Release --no-restore
      - name: Unit tests
        run: dotnet test SpriteLab.slnx -c Release --no-build --no-restore
      - name: Smoke test (non-interactive)
        run: dotnet run --project src/SpriteLab.App -c Release --no-build --no-restore -- --smoke-test
      - name: Publish portable Windows x64 candidate
        if: github.event_name != 'pull_request'
        run: dotnet publish src/SpriteLab.App/SpriteLab.App.csproj -c Release -r win-x64 --self-contained true -o portable
      - name: Smoke test published executable
        if: github.event_name != 'pull_request'
        run: |
          & ./portable/SpriteLab.App.exe --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package candidate and checksum
        if: github.event_name != 'pull_request'
        run: |
          Copy-Item docs/PORTABLE.md portable/LEEME.md
          Compress-Archive -Path portable/* -DestinationPath SpriteLab-0.2.1.4-win-x64.zip
          (Get-FileHash SpriteLab-0.2.1.4-win-x64.zip -Algorithm SHA256).Hash + '  SpriteLab-0.2.1.4-win-x64.zip' | Set-Content SpriteLab-0.2.1.4-win-x64.sha256
      - name: Upload private build artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: SpriteLab-0.2.1.4-win-x64
          path: |
            SpriteLab-0.2.1.4-win-x64.zip
            SpriteLab-0.2.1.4-win-x64.sha256
          retention-days: 14
          if-no-files-found: error
